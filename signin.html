<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signin-style.css">
</head>
<body>
    <section class="bg-image">
        <img src="images/menu banner.jpg" alt="">
    </section>

    <section class="signup-page">
        <div class="signup-card">
            <div class="signup-header">
                <div class="signup-logo">
                    <img src="images/ff logo.jpg" alt="Foodiee Foods Logo">
                </div>
                <h1>FOODIEE FOODS</h1>
            </div>
            <a href="menu.html">temp</a>
            <!-- TOP SWITCH TABS -->
            <div class="auth-wrapper">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-target="login">Login</button>
                    <button class="auth-tab" data-target="signup">New User</button>
                    <button class="auth-tab" data-target="staff">Staff</button>
                </div>
            </div>

            <div class="auth-content">
                 <!-- ================= USER LOGIN ================= -->
                <div class="auth-section active" id="login">

                    <h2>User Login</h2>

                    <form class="signup-form">

                        <label>Mobile Number</label>
                        <div class="input-group">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" required>
                        </div>

                        <label>Password</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" required>
                        </div>

                        <button type="submit" class="signup-btn">
                            Login <i class="fa-solid fa-arrow-right"></i>
                        </button>

                    </form>
                </div>

                <!-- ================= SIGN UP ================= -->
                <div class="auth-section " id="signup">

                    <h2>Create Account</h2>
                    <p>Join us and enjoy authentic South Indian cuisine</p>

                    <form class="signup-form">

                        <div class="input-group">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" placeholder="Full Name" required>
                        </div>

                        <div class="input-group">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" placeholder="Mobile Number" required>
                        </div>

                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="Password" required>
                        </div>

                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="Confirm Password" required>
                        </div>

                        <button type="submit" class="signup-btn">
                            Sign Up <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>

                </div>

                <!-- ================= STAFF LOGIN ================= -->
                <div class="auth-section" id="staff">

                    <h2>Staff Login</h2>

                    <!-- STAFF TYPE -->
                    <div class="staff-tabs">
                        <button class="staff-tab active" data-staff="staff-login">Login</button>
                        <button class="staff-tab" data-staff="staff-signin">Sign Up</button>
                    </div>

                    <!-- PRIMARY STAFF -->
                    <form class="signup-form staff-form active" id="staff-login">

                        <label>Staff ID</label>
                        <div class="input-group">
                            <i class="fa-solid fa-id-badge"></i>
                            <input type="text" required>
                        </div>

                        <label>Password</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" required>
                        </div>

                        <button type="submit" class="signup-btn">
                            Login 
                        </button>
                    </form>

                    <!-- SECONDARY STAFF -->
                    <form class="signup-form staff-form" id="staff-signin">

                        <label>Name</label>
                        <div class="input-group">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="text" required>
                        </div>

                        <label>Staff ID</label>
                        <div class="input-group">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="number" required>
                        </div>

                        <label>Password</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" required>
                        </div>

                        <button type="submit" class="signup-btn">
                            Sign in  
                        </button>
                    </form>
                </div>
            </div>
            </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
